databases:
  - name: snack-overflow-db
    databaseName: snack_overflow
    user: snack_admin
    plan: free

services:
  - type: web
    name: snack-overflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snack-overflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: snack-overflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: snack-overflow-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
